<h1>Chaleur, fraîcheur et fréquentation dans le 18e : carte de référence</h1>
<p>Méthode de la carte de référence : couches en données ouvertes, éloignement des lieux frais, population. Novembre 2026.</p>

<h2>1. Couches de référence et éloignement des lieux frais</h2>
<p>Toutes les données utilisées sont publiées comme couches indépendantes dans la carte uMap, pour la réutiliser sur d'autres sujets : îlots de chaleur (jour, nuit), îlots de fraîcheur (espaces verts, équipements et activités), métro (cercle proportionnel aux validations d'un jour ouvré de juin, et les 58 bouches d'accès du GTFS IDFM), arrêts de bus/tram, rues aux écoles, aires piétonnes, marchés, Paris Respire, écoles/crèches/aires de jeux, bancs, commerces, fontaines, QPV. Les arbres (11 500), les bâtiments et le LiDAR ne sont pas dans la carte (trop lourds pour uMap) : ils servent au calcul de l'ombre et de la végétation.</p>
<p><b>Éloignement du frais</b> : sur une grille de 50 m, distance à vol d'oiseau au lieu frais le plus proche (à pied, compter environ 1,3 fois plus).</p>
<ul>
<li><b>Lieux frais</b> : tous les îlots de fraîcheur de la Ville (espaces verts, sauf plates-bandes de voirie et jardins privés ; équipements et activités : piscines, bains-douches, bibliothèques, églises, musées, mairie, brumisateurs, ombrières de square) et les brumisateurs Eau de Paris. Un square, même peu arboré, a des sols en partie perméables et de l'ombre : il reste plus frais que la rue.</li>
<li><b>Population</b> : INSEE Filosofi 2019, carreaux de 200 m (Géoplateforme IGN), répartie sur la grille au prorata de la surface. Attributs (noms des variables INSEE renommés) : <code>habitants</code>, <code>enfants_0_3_ans</code> (de 0 à 3 ans révolus), <code>personnes_65_ans_et_plus</code>, <code>personnes_80_ans_et_plus</code>, <code>menages</code>, <code>menages_pauvres</code> (sous le seuil de pauvreté), <code>logements_sociaux</code>, <code>habitants_par_ha</code>. Les champs <code>pct_…</code> sont des pourcentages des habitants (ou des ménages pour la pauvreté). <b>Personnes fragiles à la chaleur</b> = enfants de 0-3 ans + personnes de 65 ans et plus (<code>personnes_fragiles</code>, <code>pct_fragiles</code>) : 19 % des habitants du 18e. Les valeurs INSEE sont arrondies, parfois imputées dans les carreaux peu peuplés.</li>
<li>Résultat : 11 % de la surface du 18e, soit <b>environ 17 600 habitants sur 184 000 (10 %)</b>, est à plus de 200 m d'un lieu frais, dont environ 2 100 personnes de 65 ans et plus et 900 enfants de 0-3 ans. La part de personnes fragiles y est de 17 %, proche de la moyenne du 18e (19 %) : ces zones ne sont pas plus « âgées » que le reste, elles sont surtout denses.</li>
</ul>

<p>Limites : horaires non pris en compte (squares fermés la nuit, équipements fermés le dimanche ou payants), distance à vol d'oiseau et non par les rues, population 2019 répartie uniformément dans chaque carreau.</p>


<h2>2. Ce que la carte ne dit pas</h2>
<p>Aucun capteur de température de l'air ne couvre finement le 18e en données ouvertes. Les couches décrivent ce qui fait chauffer (bâti, sol minéral, soleil, absence d'arbres) et qui y est exposé, pas une température mesurée.</p>
